        :root { --nav-duration: 360ms; --nav-ease: cubic-bezier(0.2,0.9,0.2,1); }
        .menu-toggle { display: none; flex-direction: column; justify-content: space-between; width: 32px; height: 24px; background: transparent; border: none; cursor: pointer; z-index: 1200; padding: 4px; }
        .menu-toggle .bar { width: 100%; height: 3px; background-color: #fff; border-radius: 3px; transition: transform 280ms var(--nav-ease), opacity 180ms var(--nav-ease); transform-origin: center; display:block; }
        .menu-toggle.is-active .bar:nth-child(1) { transform: translateY(9px) rotate(45deg); }
        .menu-toggle.is-active .bar:nth-child(2) { opacity: 0; transform: scaleX(0); }
        .menu-toggle.is-active .bar:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }
        @media (max-width: 768px) {
            .menu-toggle { display: flex; }
            .nav-links { display: flex; flex-direction: column; gap: 12px; position: absolute; top: calc(100% + 10px); right: 10px; background: rgba(14, 11, 31, 0.95); width: calc(100% - 20px); padding: 0.5rem 1rem; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); max-height: 0; overflow: hidden; opacity: 0; transition: max-height var(--nav-duration) var(--nav-ease), opacity calc(var(--nav-duration) / 1.2) var(--nav-ease); }
            .nav-links.active { max-height: 420px; opacity: 1; }
            .nav-links li { width: 100%; }
            .nav-links a { display: block; padding: 10px 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .menu-toggle .bar, .nav-links { transition: none !important; animation: none !important; }
        }
    </style>
